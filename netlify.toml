[build]
  command = "python manage.py collectstatic --noinput && python manage.py migrate"
  publish = "staticfiles"

[functions]
  directory = "api"
  node_bundler = "esbuild"

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/media/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
