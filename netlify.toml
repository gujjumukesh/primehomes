[build]
  command = "bash build_files.sh"
  publish = "staticfiles"

[dev]
  command = "python manage.py runserver 8000" # For local Netlify dev
  targetPort = 8000

# Serve static files directly
[[headers]]
  for = "/*"
  [headers.values]
  "Cache-Control" = "public, max-age=31536000, immutable"

# Serve static files directly
[[headers]]
  for = "/static/*"
  [headers.values]
  "Cache-Control" = "public, max-age=31536000, immutable"

# Serve media files directly
[[headers]]
  for = "/media/*"
  [headers.values]
  "Cache-Control" = "public, max-age=31536000, immutable"

